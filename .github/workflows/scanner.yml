name: CoinDCX Momentum Scanner & Paper Bot

on:
  schedule:
    # GitHub's fastest supported cron trigger is every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: momentum-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan-and-trade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m unittest discover tests

      - name: Run Momentum Scans (2-Minute Intervals)
        run: |
          echo "=== Pass 1: Immediate Scan ==="
          python app.py --mode scan
          echo "Waiting 2 minutes for next intra-cycle check..."
          sleep 120
          echo "=== Pass 2: 2-Minute Scan ==="
          python app.py --mode scan

      - name: Print Performance Audit Report
        run: |
          python app.py --mode report

      - name: Commit and Push Updated Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "No new candidates or trades to commit."
          else
            git commit -m "chore(bot): update trading records and daily summary [skip ci]"
            git push
          fi
