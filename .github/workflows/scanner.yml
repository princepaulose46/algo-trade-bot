name: CoinDCX Momentum Scanner & Paper Bot

on:
  schedule:
    # Runs every 15 minutes (aligned with 15m candle completion)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  scan-and-trade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m unittest discover tests

      - name: Run Momentum Scanner
        run: |
          python app.py --mode scan

      - name: Print Performance Audit Report
        run: |
          python app.py --mode report

      - name: Commit and Push Updated Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "No new candidates or trades to commit."
          else
            git commit -m "chore(bot): update trading records and daily summary [skip ci]"
            git push
          fi
