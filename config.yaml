app:
  timezone: "UTC"
  scan_interval_seconds: 30
  log_level: "INFO"

universe:
  market_type: "all" # "all", "perpetual", or "spot"
  min_quote_volume_24h: 20000
  max_spread_pct: 0.60
  symbols_allowlist: []
  symbols_blocklist: ["USDTINR", "USDCINR", "USDCUSDT", "FDUSDUSDT", "TUSDUSDT", "EURUSDT", "WBTCBTC", "B-USDC_USDT", "B-FDUSD_USDT"]
  min_history_candles: 55

scanner:
  strategy_name: "trend_pullback_v2" # famous EMA 20/50 + RSI Confluence
  min_change_24h_pct: 0.0
  min_change_15m_pct: 0.0
  min_relative_volume: 0.7
  rsi_min: 42.0
  require_above_vwap: false
  require_above_ema50: false
  use_open_interest_filter: false
  lookback_range_candles: 10
  max_distance_from_ema50_pct: 8.0
  cooldown_candles_after_failed: 6

paper:
  starting_equity_inr: 20000.0
  risk_fraction: 0.005
  max_open_trades: 4
  max_daily_loss_fraction: 0.02
  max_notional_fraction_equity: 1.0
  max_trade_fraction_equity: 0.25 # Maximum 25% of capital per single trade
  simulated_leverage: 1
  target_r_multiple: 2.0 # 1:2 Risk to Reward ratio
  max_holding_hours: 24
  trailing_stop_enabled: true
  trailing_stop_activation_r: 1.0

costs:
  fee_rate_per_side: 0.001
  slippage_bps_per_side: 5.0
  funding_rate: null

reports:
  directory: "./reports"
  candidates_file: "candidates.jsonl"
  trades_file: "trades.jsonl"
  daily_summary_file: "daily_summary.json"
